<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login.title">Log in · Riwaq Café</title>
  <link rel="icon" href="img/riwaq-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&family=Kufam:wght@400;500;600;700;800&family=Noto+Sans+Tifinagh&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/shared/i18n.js"></script>
</head>
<body data-root="">

  <main class="auth-page">
    <!-- Brand side -->
    <section class="auth-brand">
      <img class="logo" src="img/riwaq-lockup-light.svg" alt="Riwaq · رواق · ⵔⵉⵡⴰⵇ">
      <h1 data-i18n-html="brand.tagline">Coffee under <span>the arches</span></h1>
      <p data-i18n="brand.text">Riwaq is the shaded arcade where people pause, sit, and talk — a place of welcome, connection, and timeless hospitality.</p>
      <svg class="arches" viewBox="0 0 600 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <path fill="#FAF5EA" d="M0 0 H600 V150 H592 V80 A52.0 52.0 0 0 0 488 80 V150 H472 V80 A52.0 52.0 0 0 0 368 80 V150 H352 V80 A52.0 52.0 0 0 0 248 80 V150 H232 V80 A52.0 52.0 0 0 0 128 80 V150 H112 V80 A52.0 52.0 0 0 0 8 80 V150 H0Z"/>
      </svg>
    </section>

    <!-- Form side -->
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-top">
          <a class="back" href="index.html" data-i18n="back">← Back to home</a>
          <button type="button" class="lang-btn" data-lang-toggle>العربية</button>
        </div>
        <h2 data-i18n="login.heading">Welcome back</h2>
        <p class="sub" data-i18n="login.sub">Log in to order, serve, or manage the café.</p>

        <div id="login-alert" class="alert" role="alert" hidden></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email" data-i18n="field.email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="your@email.com" data-i18n-placeholder="ph.email">
            <div class="error"></div>
          </div>
          <div class="field">
            <label for="password" data-i18n="field.password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••">
            <div class="error"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="login.submit">Log in</button>
        </form>

        <p class="switch"><span data-i18n="login.newCustomer">New customer?</span> <a href="register.html" data-i18n="login.createAccount">Create an account</a></p>

        <div class="demo-accounts">
          <strong data-i18n="login.demoTitle">Sample accounts (password 1234)</strong>
          <button type="button" data-demo="manager@cafe.com"><bdi>manager@cafe.com</bdi> — <span data-i18n="role.manager">Manager</span></button>
          <button type="button" data-demo="cashier@cafe.com"><bdi>cashier@cafe.com</bdi> — <span data-i18n="role.cashier">Cashier</span></button>
          <button type="button" data-demo="barista@cafe.com"><bdi>barista@cafe.com</bdi> — <span data-i18n="role.barista">Barista</span></button>
          <button type="button" data-demo="customer@cafe.com"><bdi>customer@cafe.com</bdi> — <span data-i18n="role.customer">Customer</span></button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/shared/storage.js"></script>
  <script src="js/shared/auth.js"></script>
</body>
</html>
