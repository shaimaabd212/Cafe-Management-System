<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="kitchen.title">Kitchen · Riwaq</title>
  <link rel="icon" href="../img/riwaq-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+Tifinagh&family=Reem+Kufi:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/shared/i18n.js"></script>
</head>
<body data-root="../" data-layout="staff" data-page="kitchen" data-roles="barista">
<div class="admin-layout">
  <!-- Sidebar is added here by js/shared/layout.js -->

  <main class="main">
    <header class="page-head">
      <div>
        <h1 data-i18n="kitchen.heading">Kitchen queue</h1>
        <p class="sub" data-i18n="kitchen.sub">Move each order from Pending to Preparing to Ready.</p>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-outline btn-sm" id="kitchenRefresh" data-i18n="kitchen.refresh">Refresh</button>
      </div>
    </header>

    <!-- Status filter tabs + live counters -->
    <section class="kitchen-toolbar" aria-label="Kitchen order filters">
      <div class="kitchen-filters" role="group" aria-label="Filter by status">
        <button type="button" class="btn btn-sm btn-primary active" data-filter="active" data-i18n="kitchen.filterActive">Active queue</button>
        <button type="button" class="btn btn-sm btn-outline" data-filter="pending" data-i18n="kitchen.filterPending">Pending</button>
        <button type="button" class="btn btn-sm btn-outline" data-filter="preparing" data-i18n="kitchen.filterPreparing">Preparing</button>
        <button type="button" class="btn btn-sm btn-outline" data-filter="ready" data-i18n="kitchen.filterReady">Ready</button>
      </div>
      <div class="kitchen-stats">
        <span class="badge badge-pending" id="countPending">0</span>
        <span class="badge badge-preparing" id="countPreparing">0</span>
        <span class="badge badge-ready" id="countReady">0</span>
      </div>
    </section>

    <!-- Orders grid -->
    <section id="kitchenQueue" class="kitchen-grid" aria-live="polite"></section>
  </main>
</div>

<script src="../js/shared/storage.js"></script>
<script src="../js/shared/auth.js"></script>
<script src="../js/shared/layout.js"></script>
<script src="../js/barista/kitchen.js"></script>
</body>
</html>
