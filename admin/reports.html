<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="rep.title">Reports · Riwaq Admin</title>
  <link rel="icon" href="../img/riwaq-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+Tifinagh&family=Reem+Kufi:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/shared/i18n.js"></script>
</head>
<body data-root="../">
<div class="admin-layout">

  <!-- ===== Sidebar (same on every admin page) ===== -->
  <aside class="sidebar">
    <a class="brand" href="dashboard.html"><img src="../img/riwaq-lockup-light.svg" alt="Riwaq · رواق · ⵔⵉⵡⴰⵇ"></a>
    <div class="kilim-strip"></div>
    <nav>
      <div class="section" data-i18n="nav.overview">Overview</div>
      <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
      <a href="reports.html" class="active" data-i18n="nav.reports">Reports</a>
      <div class="section" data-i18n="nav.manage">Manage</div>
      <a href="users.html" data-i18n="nav.users">Users</a>
      <a href="menu-admin.html" data-i18n="nav.menu">Menu</a>
      <a href="inventory.html" data-i18n="nav.inventory">Inventory</a>
      <div class="section" data-i18n="nav.operations">Operations</div>
      <a href="../cashier/orders.html" data-i18n="nav.orders">Orders</a>
      <a href="../barista/kitchen.html" data-i18n="nav.kitchen">Kitchen</a>
    </nav>
    <div class="me">
      <div class="who" data-user-name></div>
      <div class="role" data-user-role></div>
      <div class="me-actions">
        <button class="btn btn-ghost btn-sm" data-lang-toggle>العربية</button>
        <button class="btn btn-ghost btn-sm" data-logout data-i18n="logout">Log out</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1 data-i18n="rep.heading">Sales reports</h1>
        <p class="sub" id="period-label"></p>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="export-days" data-i18n="rep.exportDays">Export daily CSV</button>
        <button class="btn btn-outline" id="export-orders" data-i18n="rep.exportOrders">Export orders CSV</button>
        <button class="btn btn-ghost" id="print-report" data-i18n="rep.print">Print</button>
      </div>
    </header>

    <section class="card" style="margin-bottom:1.25rem">
      <div class="toolbar" style="margin:0">
        <div class="field"><label data-i18n="rep.quick">Quick range</label>
          <div style="display:flex;gap:.4rem">
            <button class="btn btn-sm btn-ghost" data-range="7" data-i18n="rep.last7">Last 7 days</button>
            <button class="btn btn-sm btn-ghost" data-range="30" data-i18n="rep.last30">Last 30 days</button>
            <button class="btn btn-sm btn-ghost" data-range="month" data-i18n="rep.month">This month</button>
          </div>
        </div>
        <div class="field"><label for="from-date" data-i18n="rep.from">From</label><input type="date" id="from-date"></div>
        <div class="field"><label for="to-date" data-i18n="rep.to">To</label><input type="date" id="to-date"></div>
      </div>
    </section>

    <section class="kpis">
      <div class="card kpi accent"><div class="label" data-i18n="rep.totalSales">Total sales</div><div class="value" id="r-sales">0</div></div>
      <div class="card kpi ok"><div class="label" data-i18n="rep.completed">Completed orders</div><div class="value" id="r-completed">0</div></div>
      <div class="card kpi warn"><div class="label" data-i18n="rep.cancelled">Cancelled orders</div><div class="value" id="r-cancelled">0</div></div>
      <div class="card kpi info"><div class="label" data-i18n="kpi.avg">Average order</div><div class="value" id="r-avg">0</div></div>
    </section>

    <section class="card" style="margin-bottom:1.25rem">
      <div class="card-head"><h3 data-i18n="rep.byDay">Sales by day</h3><small data-i18n="rep.completedOnly">Completed orders only</small></div>
      <div class="chart-wrap">
        <canvas id="report-chart" data-i18n-aria="rep.byDay" aria-label="Sales by day"></canvas>
        <div class="chart-tip" id="report-tip"></div>
      </div>
    </section>

    <section class="grid-2">
      <div class="card">
        <h3 data-i18n="rep.daily">Daily breakdown</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th data-i18n="th.date">Date</th><th class="num" data-i18n="th.orders">Orders</th>
              <th class="num" data-i18n="th.average">Average</th><th class="num" data-i18n="th.sales">Sales</th>
            </tr></thead>
            <tbody id="days-body"></tbody>
            <tfoot id="days-foot"></tfoot>
          </table>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="rep.topItems">Top items</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>#</th><th data-i18n="th.item">Item</th><th class="num" data-i18n="th.qty">Qty</th><th class="num" data-i18n="th.revenue">Revenue</th>
            </tr></thead>
            <tbody id="items-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="../js/shared/storage.js"></script>
<script src="../js/shared/auth.js"></script>
<script>guard(["manager"]);</script>
<script src="../js/admin/dashboard.js"></script>
<script src="../js/admin/reports.js"></script>
</body>
</html>
