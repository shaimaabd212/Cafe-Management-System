<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders · Riwaq Café</title>
  <link rel="icon" href="../img/riwaq-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+Tifinagh&family=Reem+Kufi:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/shared/i18n.js"></script>
  <style>
    /* ---- styles only for this page ---- */
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-tabs button {
      font: inherit; font-weight: 500; cursor: pointer;
      background: var(--card); color: var(--ink);
      border: 1px solid var(--line); border-radius: 999px; padding: 7px 18px;
    }
    .filter-tabs button.active { background: var(--red); border-color: var(--red); color: var(--lime); }
    .filter-tabs button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    #orders-list { display: grid; gap: 16px; margin-bottom: 24px; }
    .order-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }

    /* status tracker: Pending → Preparing → Ready → Completed */
    .tracker {
      list-style: none; display: flex; margin: 14px 0 4px; padding: 0;
    }
    .tracker li {
      flex: 1; text-align: center; font-size: 0.82rem; color: var(--muted);
      position: relative; padding-top: 18px;
    }
    .tracker .dot {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--line); border: 2px solid var(--line);
    }
    .tracker li::before {           /* connecting line */
      content: ""; position: absolute; top: 7px; left: -50%;
      width: 100%; height: 2px; background: var(--line);
    }
    .tracker li:first-child::before { display: none; }
    .tracker li.done,  .tracker li.now { color: var(--ink); }
    .tracker li.done .dot { background: var(--green); border-color: var(--green); }
    .tracker li.done::before { background: var(--green); }
    .tracker li.now .dot { background: var(--saffron); border-color: var(--saffron); }
    .tracker li.now::before { background: var(--green); }
    .tracker li.now { font-weight: 700; }

    .order-items { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .order-items td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
    .order-items td:first-child { width: 1%; white-space: nowrap; color: var(--muted); }
    .order-items td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .order-items tfoot td { border-bottom: none; font-weight: 700; }
    .order-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
    .empty { padding: 48px 20px; }
    .empty p { margin-top: 0; }
  </style>
</head>
<body data-root="../" data-layout="site" data-page="my-orders" data-roles="customer">
<!-- Navbar + footer are added by js/shared/layout.js -->

  <main class="container site-main">
    <div class="page-head">
      <div>
        <h1>My Orders</h1>
        <p class="sub">Welcome back, <span id="hello-name"></span>. Track your orders here — the status updates as the kitchen works.</p>
      </div>
      <div class="filter-tabs" role="group" aria-label="Filter orders">
        <button class="active" onclick="setFilter('active', this)">Active (<span id="count-active">0</span>)</button>
        <button onclick="setFilter('completed', this)">Completed</button>
        <button onclick="setFilter('cancelled', this)">Cancelled</button>
        <button onclick="setFilter('all', this)">All</button>
      </div>
    </div>

    <section id="orders-list" aria-live="polite"><!-- filled by orders.js --></section>
  </main>

  <script src="../js/shared/storage.js"></script>
  <script src="../js/shared/auth.js"></script>
  <script src="../js/shared/layout.js"></script>
  <script src="../js/customer/orders.js"></script>
</body>
</html>
