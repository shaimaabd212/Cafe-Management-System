<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="orders.title">Orders · Riwaq</title>
  <link rel="icon" href="../img/riwaq-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+Tifinagh&family=Kufam:wght@400;500;600;700;800&family=Changa:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ---- Fonts for the front-of-house pages (M3 · Shaima) ----
       English: Changa (bold headings). Arabic: Kufam. */
    :root {
      --font-head: "Changa", "Tajawal", sans-serif;
      --font-body: "Changa", "Tajawal", system-ui, sans-serif;
      --font-ar-head: "Kufam", sans-serif;
      --font-ar-body: "Kufam", sans-serif;
    }
    h1, h2, h3 { font-weight: 700; }
    /* Header: show the role badge only, not the user name */
    .navbar .nav-user .name { display: none; }
    /* Arabic (Kufam) is wide, so use a slightly smaller size: 15px instead of 16px */
    html[dir="rtl"] { font-size: 93.75%; }
    html[dir="rtl"] body { font-size: 15px; }
  </style>
  <script src="../js/shared/i18n.js"></script>
  <style>
    /* ---- styles only for this page ---- */

    /* Tabs: New · In the kitchen · Ready · Done */
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .filter-tabs button {
      font: inherit; font-weight: 600; cursor: pointer; min-height: 44px;
      background: var(--card); color: var(--ink);
      border: 1px solid #CDB48C; border-radius: 999px; padding: 0 18px;
    }
    .filter-tabs button .n {
      display: inline-block; min-width: 1.6em; margin-inline-start: 6px; padding: 0 6px; border-radius: 999px;
      background: var(--lime); color: var(--ink); font-size: .85rem; text-align: center;
    }
    .filter-tabs button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--lime); }
    .filter-tabs button[aria-pressed="true"] .n { background: var(--lime); color: var(--red); }
    .filter-tabs button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    /* Order cards */
    .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
    .order-card { display: flex; flex-direction: column; gap: 10px; }
    .order-card.is-cancelled { opacity: .65; }
    .order-card .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .order-card h2 { font-size: 1.4rem; margin: 0; line-height: 1.2; }
    .order-card .meta { margin: 0; color: var(--muted); font-size: .9rem; }
    .order-card .meta b { color: var(--ink); font-weight: 600; }
    .badge-new { background: var(--red); color: var(--lime); }
    .order-lines { list-style: none; margin: 0; padding: 8px 0; border-top: 1px dashed #DCCBAA; border-bottom: 1px dashed #DCCBAA; }
    .order-card .order-lines li { display: block; padding: 3px 0; border: 0; }   /* "2 × Matcha Latte" on one line */
    .order-lines li b { color: var(--red); }
    .order-card .note { margin: 0; padding: 6px 10px; background: var(--lime); border-radius: 4px; font-size: .88rem; color: var(--muted); }
    .order-card .total { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
    .order-card .total .value { color: var(--red); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .order-card .actions { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: auto; }
    .order-card .actions .btn { width: 100%; min-height: 44px; }
    .order-card .link-btn {
      padding: 2px 4px; border: 0; background: none; cursor: pointer;
      font: inherit; font-size: .88rem; color: var(--muted); text-decoration: underline;
    }
    .order-card .link-btn:hover { color: var(--red); }
    .order-card .link-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .orders-empty { text-align: center; padding: 40px 16px; color: var(--muted); }

    /* Walk-in order form (modal) */
    .walk-modal { max-width: 640px; max-height: calc(100vh - 2rem); display: flex; flex-direction: column; }
    .walk-modal .modal-body { overflow-y: auto; }
    .walk-type { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
    .walk-type input { position: absolute; opacity: 0; pointer-events: none; }
    .walk-type label {
      display: block; text-align: center; padding: 10px; cursor: pointer; font-weight: 700;
      background: var(--white); border: 1px solid #CDB48C; border-radius: var(--radius-ui);
    }
    .walk-type input:checked + label { border: 2px solid var(--green); background: #E5F0EA; color: var(--green); }
    .walk-type input:focus-visible + label { outline: 3px solid var(--blue); outline-offset: 2px; }
    .walk-items { max-height: 290px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--white); }
    .walk-items h3 { margin: 0; padding: 8px 12px 4px; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--card); position: sticky; top: 0; }
    [dir="rtl"] .walk-items h3 { letter-spacing: 0; }
    .walk-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #F1E8D6; }
    .walk-row .nm { font-weight: 600; }
    .walk-row .pr { color: var(--muted); font-size: .85rem; }
    .walk-row .stepper button { width: 34px; height: 34px; }
    .walk-row .stepper .qty { min-width: 28px; }
    .walk-sum { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 4px; font-weight: 700; }
    .walk-sum .value { color: var(--red); font-size: 1.3rem; }
    .walk-error { color: var(--red); font-size: .85rem; min-height: 1.2em; margin: 0 0 6px; }
    .field textarea {
      width: 100%; padding: .6rem .85rem; font: 1rem var(--font-body); color: var(--ink); resize: vertical; min-height: 56px;
      background: var(--white); border: 1.5px solid var(--line); border-radius: 8px;
    }
    .field textarea:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(179, 38, 30, .12); }
    [dir="rtl"] #walk-table { direction: ltr; text-align: right; }

  </style>
</head>
<body data-root="../" data-layout="staff" data-page="orders" data-roles="cashier,manager">
<div class="admin-layout">
  <!-- Sidebar is added here by js/shared/layout.js (links depend on the role) -->

  <main class="main">
    <header class="page-head">
      <div>
        <h1 data-i18n="orders.heading">Orders</h1>
        <p class="sub" data-i18n="orders.sub">Confirm new orders, then take the payment and print the bill when they are ready.</p>
      </div>
      <div class="actions"><button type="button" class="btn btn-primary" id="new-order" data-i18n="orders.new">New walk-in order</button></div>
    </header>

    <!-- ===== Page content (M3 · Shaima) — filled by js/cashier/orders.js ===== -->
    <div class="filter-tabs" id="filter-tabs" role="group" aria-label="Show orders" data-i18n-aria="cash.filter"><!-- filled by orders.js --></div>

    <section class="order-grid" id="order-grid" aria-live="polite"><!-- order cards --></section>
    <p class="card orders-empty" id="orders-empty" hidden></p>
  </main>
</div>

<!-- ===== New walk-in order ===== -->
<div class="modal-backdrop" id="walk-modal" role="dialog" aria-modal="true" aria-labelledby="walk-title">
  <div class="modal walk-modal">
    <div class="roofline-strip"></div>
    <div class="modal-body">
      <h2 id="walk-title" data-i18n="walk.title">New walk-in order</h2>
      <form id="walk-form" novalidate>
        <div class="walk-type" role="radiogroup">
          <input type="radio" name="type" id="walk-dine" value="dine-in" checked>
          <label for="walk-dine" data-i18n="type.dine-in">Dine-in</label>
          <input type="radio" name="type" id="walk-take" value="takeaway">
          <label for="walk-take" data-i18n="type.takeaway">Takeaway</label>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="walk-name"><span data-i18n="walk.name">Customer name</span> <span class="opt" data-i18n="field.optional">(optional)</span></label>
            <input id="walk-name" name="name" type="text" maxlength="40" placeholder="Walk-in customer" data-i18n-placeholder="ph.walkName">
          </div>
          <div class="field" id="walk-table-field">
            <label for="walk-table" data-i18n="cart.table">Table number</label>
            <input id="walk-table" name="table" type="number" inputmode="numeric" min="1" max="50" placeholder="1–50">
            <div class="error"></div>
          </div>
        </div>

        <div class="field">
          <label for="walk-find" data-i18n="walk.items">Items</label>
          <input id="walk-find" type="search" autocomplete="off" placeholder="Find an item…" data-i18n-placeholder="ph.itemSearch">
        </div>
        <div class="walk-items" id="walk-items"><!-- filled by orders.js --></div>
        <div class="walk-sum"><span data-i18n="order.total">Total</span><span class="value" id="walk-total">0</span></div>
        <p class="walk-error" id="walk-error" role="alert"></p>

        <div class="field">
          <label for="walk-note"><span data-i18n="cart.note">Note for the barista</span> <span class="opt" data-i18n="field.optional">(optional)</span></label>
          <textarea id="walk-note" name="note" maxlength="200" placeholder="Less sugar, oat milk…" data-i18n-placeholder="ph.note"></textarea>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="walk-close" data-i18n="walk.close">Close</button>
          <button type="submit" class="btn btn-secondary" data-i18n="walk.create">Send to the kitchen</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../js/shared/storage.js"></script>
<script src="../js/shared/auth.js"></script>
<script src="../js/shared/layout.js"></script>
<script src="../js/shared/menu-common.js"></script>
<script src="../js/cashier/orders.js"></script>
</body>
</html>
